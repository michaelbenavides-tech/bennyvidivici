name: release

on:
  push:
    tags: ["v*.*.*"]

jobs:
  publish-images:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: docker build -t ghcr.io/${{ github.repository }}/backend:${{ github.ref_name }} -t ghcr.io/${{ github.repository }}/backend:latest ./backend
      - run: docker build -t ghcr.io/${{ github.repository }}/frontend:${{ github.ref_name }} -t ghcr.io/${{ github.repository }}/frontend:latest ./frontend
      - run: docker push ghcr.io/${{ github.repository }}/backend:${{ github.ref_name }}
      - run: docker push ghcr.io/${{ github.repository }}/backend:latest
      - run: docker push ghcr.io/${{ github.repository }}/frontend:${{ github.ref_name }}
      - run: docker push ghcr.io/${{ github.repository }}/frontend:latest

  create-release:
    runs-on: ubuntu-latest
    needs: [publish-images]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: tar -czf ai-sgp-helm-${{ github.ref_name }}.tar.gz helm/ai-sgp
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            docker-compose.yml
            .env.example
            ai-sgp-helm-${{ github.ref_name }}.tar.gz
